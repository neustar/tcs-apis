# TransUnion Trusted Call Solutions (TCS) - API - 6.6.2
openapi: "3.0.3"
info:
  title: "TransUnion Trusted Call Solutions (TCS) - API - 6.6.2"
  version: "6.6.2"
  description: "Unified OpenAPI specification for the TransUnion Trusted Call Solutions (TCS) platform. Covers Call Authentication (AAM login/token), SDPR account, feature, caller profile, business profile, image, image profile, and TN asset endpoints across CCID, CNO, BCD, and SCP products, plus Analytics and Webhook Notification APIs. The inbound webhook event delivery contract is documented under x-webhooks."
  contact:
    name: "Transunion TCS Customer Support"
    email: "calleridsupport@transunion.com"
    url: "https://www.transunion.com/solution/trucontact"
servers:
- url: "https://api-rst.ccid.neustar.biz"
  description: "Production"
- url: "https://api-uat-rst.ccid.neustar.biz"
  description: "UAT / Sandbox"
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Obtain a JWT access token via the /ccid/aam/v1/login endpoint"
    ApiKeyAuth:
      type: "apiKey"
      in: "query"
      name: "apiKey"
      description: "API key for Call Authentication (CCID /authn) sent as a query parameter. Alternative to the preferred Authorization Bearer header or a pre-registered remote IP / CIDR allowlist."
    IdentityBearerAuth:
      type: "http"
      scheme: "bearer"
      description: "Preferred authentication for Call Authentication (CCID /authn). Send your provisioned API key as an HTTP Bearer token in the Authorization header: `Authorization: Bearer YOUR_API_KEY`."
paths:
  "/ccid/authn/v2/identity":
    post:
      summary: "Call Authentication (CCID)"
      description: "Standards-based REST API for verifying caller identity using IETF RFC 8224 and the ATIS SHAKEN framework. Call Authentication is a prerequisite for both Spoofed Call Protection (SCP) and Branded Call Display (BCD) to function. Base URLs by region — US low-latency: https://tcs.ccid.neustar.biz, US standard: https://authn.ccid.neustar.biz, Canada: https://authn-ca.ccid.neustar.biz. Preferred authentication is the provisioned API key sent as an HTTP Bearer token in the Authorization header. Alternatives: apiKey query parameter or a pre-registered remote IP / CIDR allowlist."
      operationId: "call-authentication-identity"
      tags:
      - "Call Authentication"
      security:
      - IdentityBearerAuth: []
      - ApiKeyAuth: []
      - {}
      parameters:
      - name: "apiKey"
        in: "query"
        required: false
        description: "Your provisioned API key. Only used when not sending the key via the Authorization header or when the request does not originate from a pre-registered IP/CIDR range. Header-based Bearer authentication is preferred."
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required:
              - "from"
              - "to"
              properties:
                from:
                  type: "string"
                  description: "Calling party's TN in TEL URI format (RFC 3966). Example: tel:+17201234567"
                to:
                  type: "string"
                  description: "Called party's TN in TEL URI format. Example: tel:+12482989788"
                origid:
                  type: "string"
                  description: "Unique origination identifier for call tracing and audit logging."
            example:
              from: "tel:+17201234567"
              to: "tel:+12482989788"
              origid: "usefulenterpriseuniquenumber"
      responses:
        "200":
          description: "OK — identity assertion accepted. Response body is intentionally empty."
        "400":
          description: "Bad Request — API key missing/invalid or parameter error"
          content:
            "application/json":
              schema:
                type: "object"
              example:
                error_id: "ApiKeyRequired"
                http_status_code: 400
                reason: "API key is required"
                timestamp: "Thu, 2 Apr 2026 13:04:03 GMT"
        "403":
          description: "Forbidden — required request body field missing"
          content:
            "application/json":
              schema:
                type: "object"
              example:
                error_id: "RequestFromHeaderRequired"
                http_status_code: 403
                reason: "From header value required"
                timestamp: "Thu, 2 Apr 2026 13:04:03 GMT"
        "500":
          description: "Internal Server Error"
  "/ccid/aam/v1/login":
    post:
      summary: "Create Auth Token"
      description: "Authenticate with the TCS platform to obtain an access token. This token is required in the Authorization header of all subsequent API calls."
      operationId: "auth-token"
      tags:
      - "Authentication"
      security: []
      x-source-id: "auth-token"
      x-source-name: "Create Auth Token"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                userId:
                  type: "string"
                  description: "The admin user ID provided during onboarding"
                  x-constraints: "Must be a valid provisioned user"
                password:
                  type: "string"
                  description: "The password associated with the admin user"
                  x-constraints: "Must match the provisioned credentials"
              required:
              - "userId"
              - "password"
            example:
              userId: "{{adminUserId}}"
              password: "{{password}}"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    description: "Result of the login attempt"
                    x-constraints: "\"success\" or \"failure\""
                  message:
                    type: "string"
                    description: "Human-readable result message"
                  accessToken:
                    type: "string"
                    description: "JWT access token for authenticating subsequent API calls"
                    x-constraints: "Bearer token, include in Authorization header"
                  refreshToken:
                    type: "string"
                    description: "JWT refresh token for obtaining new access tokens without re-authenticating"
                  idToken:
                    type: "string"
                    description: "JWT ID token containing the authenticated user's identity claims (subject, email, account context)"
                required:
                - "status"
                - "message"
                - "accessToken"
                - "refreshToken"
                - "idToken"
              example:
                status: "success"
                message: "Login is successful"
                accessToken: "<JWT_ACCESS_TOKEN>"
                refreshToken: "<JWT_REFRESH_TOKEN>"
                idToken: "<JWT_ID_TOKEN>"
        "401":
          description: "Unauthorized — invalid or expired access token"
        "404":
          description: "Not Found — resource does not exist"
  "/ccid/aam/v2/admin/account":
    post:
      summary: "Create Account"
