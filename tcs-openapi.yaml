                status:
                  type: "string"
                  description: "The initial status of the account"
                relationship:
                  type: "string"
                  description: "The relationship type to TransUnion"
                parent_account:
                  type: "array"
                  items: {}
                  description: "List of parent account IDs this account belongs to"
                billing:
                  type: "object"
