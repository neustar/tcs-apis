                    type: "integer"
                    description: "Image height in pixels"
                  size:
                    type: "integer"
                    description: "Image size in bytes"
                  note:
                    type: "string"
                    description: "Client supplied note associated with the image"
                  url:
                    type: "string"
                    description: "Client supplied URL used for downloading the image data"
                  image_url:
                    type: "string"
                    description: "URL to image that was accepted by TransUnion and that can be accessed using Bearer Token"
                  account_id:
                    type: "string"
                    description: "Account that owns the image"
