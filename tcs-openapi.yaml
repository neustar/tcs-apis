              type: "object"
              properties:
                feature:
                  type: "array"
                  items: {}
                  description: "List of feature types to enable on the account"
                service:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      name:
                        type: "string"
                        description: "The service/feature name to configure partners for"
                      partner:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              description: "Carrier partner name"
                            status:
                              type: "string"
                              description: "Requested enablement status for the partner"
                          required:
                          - "name"
                          - "status"
                        description: "List of carrier partner configuration objects"
