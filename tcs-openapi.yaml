    post:
      summary: "Create Business Profile"
      description: "Create and attach a Business Profile to a BPO's account. A Business Profile captures the key details of a single BPO end client (name, category, address, primary contact, website) and serves as the foundational identity that Caller Profiles are linked to. Required only for accounts with a DIRECT_BPO or RESELLER_BPO relationship — one Business Profile must be created for each end client the BPO supports."
      operationId: "create-business-profile"
      tags:
      - "Business Profile"
      security:
      - BearerAuth: []
      x-source-id: "create-business-profile"
      x-source-name: "Create Business Profile"
