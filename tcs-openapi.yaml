  "/ccid/sdpr/v4/admin/account/{accountId}/orig/tcs/asset":
    post:
      summary: "Create TN Asset"
      description: "Register a telephone number (TN) as an asset on the account and associate it with a caller profile created in the previous step."
      operationId: "create-tn-asset"
      tags:
      - "TN Assets"
      security:
      - BearerAuth: []
      x-source-id: "create-tn-asset"
      x-source-name: "Create TN Asset"
      parameters:
      - name: "accountId"
        in: "path"
        required: true
        description: "Unique identifier of the account"
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                full_ownership:
                  type: "boolean"
                  description: "Whether the TN is fully owned by the customer (carrier-vetted). Defaults to true when omitted."
                tn:
                  type: "object"
                  properties:
                    orig:
                      type: "object"
                      properties:
                        start:
                          type: "string"
                          description: "Telephone number in E.164 format"
                      required:
                      - "start"
                caller_profile_id:
                  type: "string"
                  description: "ID of the caller profile to associate with this TN"
                calling_use_case:
                  type: "string"
                  description: "Describes the intended calling use case. Mandatory for the CNO feature."
                label:
                  type: "array"
                  items: {}
                  description: "User-defined labels to categorize/track telephone numbers"
              required:
              - "caller_profile_id"
            examples:
              create-tn-asset:
                summary: "Create TN Asset"
                value:
                  full_ownership: true
                  tn:
                    orig:
                      start: "+1.5715550123"
                  caller_profile_id: "{{profileId}}"
                  label:
                  - "test$label1"
                  - "test$label8"
              create-tn-asset-byoc:
                summary: "Create TN Asset (BYOC)"
                value:
                  full_ownership: false
                  tn:
                    orig:
                      start: "+1.5555855555"
                  caller_profile_id: "{{profileId}}"
                  label:
                  - "test$label1"
                  - "test$label8"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "Unique TN asset identifier"
                    x-constraints: "24-character hex string"
                  state:
                    type: "string"
                    description: "Current state of the asset"
                    x-constraints: "ACTIVE, INACTIVE, VETTING, VETTING_DEFERRED, HOLD, DELETE, NONE, UNKNOWN"
                  account_id:
                    type: "string"
                    description: "Account this TN belongs to"
                  vetter:
                    type: "string"
                    description: "Entity performing vetting"
                    x-constraints: "CARRIER (for full_ownership=true) or NEUSTAR (for BYOC)"
                  priority:
                    type: "integer"
                    description: "Priority value for asset selection"
                    x-constraints: "Lower number = higher priority. Default: 0"
                  full_ownership:
                    type: "boolean"
                    description: "Ownership flag as submitted"
                  owner_type:
                    type: "string"
                    description: "Type of TN owner"
                    x-constraints: "carrier, enterprise, or subscriber"
                  parent_account_id:
                    type: "string"
                    description: "Parent account ID"
                  super_account_id:
                    type: "string"
                    description: "Top-level account ID in the hierarchy"
                  tn:
                    type: "object"
                    properties:
                      orig:
                        type: "object"
                        properties:
                          start:
                            type: "string"
                            description: "The telephone number"
                          count:
                            type: "integer"
                            description: "Number of TNs in range"
                            x-constraints: "Always 1 (ranges not supported)"
                        required:
                        - "start"
                        - "count"
                  vetting:
                    type: "object"
                    properties:
                      request_timestamp:
                        type: "string"
                        x-format: "date-time"
                        description: "When the vetting request was submitted"
                        x-constraints: "RFC 1123 format"
                      status:
                        type: "string"
                        description: "Vetting status. PREVETTED and VETTING_DEFERRED apply to trusted vetting partners or resellers."
                        x-constraints: "PREVETTED, VETTING_SUBMITTED, or VETTING_DEFERRED"
                      status_timestamp:
                        type: "string"
                        x-format: "date-time"
                        description: "When vetting status last changed"
                    required:
                    - "status"
                  caller_profile:
                    type: "string"
                    description: "Name of the associated caller profile"
                  caller_profile_id:
                    type: "string"
                    description: "ID of the associated caller profile"
                  label:
                    type: "array"
                    items: {}
                    description: "User-defined labels echoed back on the asset"
                    x-constraints: "Array of strings, each up to 60 characters"
                  calling_use_case:
                    type: "string"
                    description: "Intended calling use case echoed from the request (mandatory when CNO is attached)"
                    x-constraints: "1-128 characters"
                  tagging_status:
