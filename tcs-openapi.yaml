                      description: "BPO end client's state/region code"
                      x-constraints: "Max 2 characters"
                    country:
                      type: "string"
                      description: "BPO end client's country code"
                      x-constraints: "Max 2 characters following the ISO 3166 standard"
                    zip:
                      type: "string"
                      description: "BPO end client's zip code"
                      x-constraints: "Max 20 characters"
                  required:
                  - "address"
                  - "city"
                  - "state"
                  - "country"
                  - "zip"
                contact:
