  "/ccid/media/v1/admin/account/{accountId}/image":
    post:
      summary: "Create Image with URL"
      description: "Upload an image by providing a publicly accessible URL. The image is downloaded, processed, and stored internally. Save the returned image id — it will be used when creating an image profile."
      operationId: "create-image"
      tags:
      - "Image"
      security:
      - BearerAuth: []
      x-source-id: "create-image"
      x-source-name: "Create Image with URL"
      parameters:
      - name: "accountId"
        in: "path"
        required: true
        description: "Unique identifier of the account"
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "Client supplied name associated with the image"
                  x-constraints: "The length is between 1 to 255, inclusive."
                url:
                  type: "string"
                  description: "Client supplied URL for downloading the image data"
                  x-constraints: "Must be a valid URL"
                note:
                  type: "string"
                  description: "Client supplied note associated with the image"
                  x-constraints: "The length is between 1 to 255, inclusive."
                data:
                  type: "string"
                  description: "Client supplied Base64-encoded image raw data"
                  x-constraints: "The data must result in a valid image with its size under the system-defined limit"
              required:
              - "name"
            examples:
              create-image:
                summary: "Create Image with URL"
                value:
                  name: "Smiley-Face-256x256"
                  note: "Smiley icon with 32-bits per pixel"
                  url: "https://www.example.biz/logo/smiley.bmp"
