  "/ccid/sdpr/v4/admin/account/{accountId}/caller-profile":
    post:
      summary: "Attach Rich BCD Caller Profile"
      description: "Create a caller profile for Rich Branded Call Display. Includes branded caller name, call reason, and image profile for logo display on the recipient's device."
      operationId: "attach-bcd-caller-profile"
      tags:
      - "Caller Profile"
      security:
      - BearerAuth: []
      x-source-id: "attach-bcd-caller-profile"
      x-source-name: "Attach Rich BCD Caller Profile"
      parameters:
      - name: "accountId"
        in: "path"
        required: true
        description: "Unique identifier of the account"
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                service:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      name:
                        type: "string"
                        description: "Service name"
                      partner:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            name:
                              type: "string"
                              description: "Carrier partner name"
                            status:
                              type: "string"
                              description: "Initial review status"
                          required:
                          - "name"
                          - "status"
                        description: "Carrier partner configurations"
                    required:
                    - "name"
                    - "partner"
                  description: "List of service objects for the caller profile"
                business_profile_id:
                  type: "string"
                  description: "ID of the Business Profile to associate with this Caller Profile. Required for accounts with a DIRECT_BPO or RESELLER_BPO relationship."
                  x-constraints: "24-character hex string; must reference an existing Business Profile on the account"
                branded_caller_name:
                  type: "string"
                  description: "The business name to display on recipient devices."
                call_reason:
                  type: "string"
                  description: "The reason/category for the call shown on display."
                image_profile_id:
                  type: "string"
                  description: "ID of a previously uploaded image profile for logo display."
                caller_name:
                  type: "string"
                  description: "The caller name to display on landline devices. Mandatory for CNO caller profiles."
              required:
              - "service"
            examples:
              attach-bcd-caller-profile:
                summary: "Attach Rich BCD Caller Profile"
                value:
                  branded_caller_name: "Your Company Name"
                  call_reason: "Account Update"
                  image_profile_id: "{{imageId}}"
                  service:
                  - name: "CCID-ORIG"
                    partner: []
                  - name: "RICH-BCD"
                    partner:
                    - name: "att"
                      status: "TU-Review-Requested"
                    - name: "tmobile"
                      status: "TU-Review-Requested"
                    - name: "verizon"
                      status: "TU-Review-Requested"
              attach-scp-caller-profile:
                summary: "Attach SCP Caller Profile"
                value:
                  service:
                  - name: "CCID-ORIG"
                    partner: []
                  - name: "SPOOF-CALL-PROTECTION"
                    partner:
                    - name: "att"
                      status: "TU-Review-Requested"
                    - name: "tmobile"
                      status: "TU-Review-Requested"
                    - name: "verizon"
                      status: "TU-Review-Requested"
              attach-auth-bcd-caller-profile:
                summary: "Attach AUTH-BCD Caller Profile"
                value:
                  branded_caller_name: "Your Company Name"
                  service:
                  - name: "CCID-ORIG"
                    partner: []
                  - name: "AUTH-BCD"
                    partner:
                    - name: "att"
                      status: "TU-Review-Requested"
                    - name: "tmobile"
                      status: "TU-Review-Requested"
                    - name: "verizon"
                      status: "TU-Review-Requested"
              attach-cno-caller-profile:
                summary: "Attach CNO Caller Profile"
                value:
                  caller_name: "Your Co Name"
                  service:
                  - name: "CCID-ORIG"
                    partner: []
                  - name: "CNO"
                    partner:
                    - name: "att"
                      status: "TU-Review-Requested"
                    - name: "tmobile"
                      status: "TU-Review-Requested"
                    - name: "verizon"
                      status: "TU-Review-Requested"
      responses:
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "Unique caller profile ID assigned by the system"
                    x-constraints: "24-character hex string"
                  name:
                    type: "string"
                    description: "System-generated profile name (e.g., Your Company Name_SCP_20260225-212320)"
                  account_id:
                    type: "string"
                    description: "The account this profile belongs to"
                  service:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        name:
                          type: "string"
                          description: "Service name (CCID-ORIG, SPOOF-CALL-PROTECTION)"
                        partner:
                          type: "array"
                          items:
                            type: "object"
                            properties:
                              name:
                                type: "string"
                                description: "Carrier partner name"
                                x-constraints: "att | tmobile | verizon"
                              status:
                                type: "string"
                                description: "Current partner status"
                                x-constraints: "TU-Review-Requested → Enable-Requested → Enable-Processing → Enable-Completed"
                            required:
                            - "name"
                            - "status"
                          description: "Carrier partner status entries"
                      required:
                      - "name"
                      - "partner"
                    description: "Service configuration echoed back with partner statuses"
                  vetting:
                    type: "object"
                    description: "Current vetting state of the caller profile"
                    properties:
                      status:
                        type: "string"
                        description: "Vetting status"
                        x-constraints: "PREVETTED | VETTING_SUBMITTED | VETTING_IN_PROGRESS | VETTING_DEFERRED | VETTING_SUCCESSFUL"
                      status_timestamp:
                        type: "string"
                        x-format: "date-time"
                        description: "Timestamp of the last vetting status change"
                        x-constraints: "RFC 1123 format"
                  created_by:
                    type: "string"
                    description: "User who created the profile"
                  created_date:
                    type: "string"
                    x-format: "date-time"
                    description: "Creation timestamp"
                    x-constraints: "RFC 1123 format"
                  business_profile_id:
                    type: "string"
                    description: "Associated Business Profile ID (returned only for BPO accounts)"
                  business_profile_name:
                    type: "string"
                    description: "Associated Business Profile name (returned only for BPO accounts)"
                  branded_caller_name:
                    type: "string"
                    description: "The branded business name"
                  call_reason:
                    type: "string"
                    description: "Call reason/category (omitted if not provided in request)"
                  image_profile_name:
                    type: "string"
                    description: "Name of the associated image profile (Rich BCD)"
                  image_profile_id:
                    type: "string"
                    description: "Associated image profile ID (omitted if not provided in request)"
