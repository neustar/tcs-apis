          "application/json":
            schema:
              type: "object"
              properties:
                webhook_name:
                  type: "string"
                  description: "A human-readable name for this webhook configuration"
                description:
                  type: "string"
                  description: "Optional description of the webhook purpose"
                state:
                  type: "string"
                  description: "State of the webhook. Set to PAUSED to pause deliveries or ACTIVE to resume."
                  x-constraints: "ACTIVE | PAUSED"
                max_retry:
                  type: "integer"
                  description: "Maximum number of retry attempts for failed deliveries"
                  x-constraints: "Recommended: 3-5"
                email:
                  type: "array"
                  items: {}
                  description: "Email addresses or PDLs to notify after max retries are exhausted and for cool-off events"
                auth_type:
                  type: "string"
                  description: "Authentication method for your callback endpoint"
                  x-constraints: "oAuth | apiKey | none"
                credentials:
