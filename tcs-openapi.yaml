          type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                  description: "BPO end client's business name. Does not display on outbound calls."
                  x-constraints: "Must be unique across BPO end clients in the same account. Max 30 characters"
                category:
                  type: "string"
                  description: "BPO end client's business category"
                  x-constraints: "Restricted values: Accommodation and Food Services, Administrative and Support and Waste Management and Remediation Services, Agriculture, Forestry, Fishing and Hunting, Arts, Entertainment, and Recreation, Construction, Educational Services, Finance and Insurance, Health Care and Social Assistance, Information, Management of Companies and Enterprises, Manufacturing, Mining, Quarrying, and Oil and Gas Extraction, Other Services (except Public Administration), Professional, Scientific, and Technical Services, Real Estate and Rental and Leasing, Retail Trade, Transportation and Warehousing, Utilities, Wholesale Trade, Public Administration"
                address:
                  type: "object"
                  description: "BPO end client's address details"
                  x-constraints: "Must be a valid address object"
                  properties:
                    address:
                      type: "string"
                      description: "BPO end client's street address"
                      x-constraints: "Min 1 character; Max 363 characters"
                    city:
                      type: "string"
                      description: "BPO end client's city name"
                      x-constraints: "Min 1 character; Max 28 characters"
                    state:
