                        description: "BPO end client's contact first name"
                        x-constraints: "Min 1 character; Max 50 characters"
                      last_name:
                        type: "string"
                        description: "BPO end client's contact last name"
                        x-constraints: "Min 1 character; Max 50 characters"
                      email:
