                  description: "Services to provision for this account"
                child_account_enabled:
                  type: "boolean"
                  description: "Whether child accounts can be created under this account"
                domain:
                  type: "string"
                  description: "Domain associated with the account"
                comment:
                  type: "string"
                  description: "Free-text comment"
                contact:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      first_name:
                        type: "string"
                        description: "First name of the contact"
                      last_name:
                        type: "string"
                        description: "Last name of the contact"
                      email:
                        type: "string"
                        description: "Email address of the contact"
                      phone:
                        type: "string"
                        description: "Phone number of the contact"
                      type:
                        type: "string"
                        description: "Type of contact"
