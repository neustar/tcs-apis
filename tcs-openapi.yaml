  "/ccid/analytics/v1/admin/account/{accountId}/tn":
    get:
      summary: "Single TN Analytics"
      description: "Returns analytics for a single telephone number across BCD and/or SCP services."
      operationId: "analytics-single-tn"
      tags:
      - "Analytics"
      security:
      - BearerAuth: []
      parameters:
      - name: "accountId"
        in: "path"
        required: true
        description: "Unique account identifier."
        schema:
          type: "string"
      - name: "tn"
        in: "query"
        required: true
        description: "Telephone number in E.164 format (e.g. +12025551234)."
        schema:
          type: "string"
      - name: "service"
        in: "query"
        required: true
        description: "Service type(s): \"bcd\", \"scp\", or both (repeat the parameter)."
        schema:
          type: "array"
          items:
            type: "string"
            enum:
            - "bcd"
            - "scp"
        style: "form"
        explode: true
      - name: "start_time"
        in: "query"
        required: true
        description: "Start of analytics window in UTC (e.g. 2026-04-01T00:00:00Z)."
        schema:
          type: "string"
          format: "date-time"
      - name: "end_time"
        in: "query"
        required: true
        description: "End of analytics window in UTC (e.g. 2026-04-01T23:59:59Z)."
