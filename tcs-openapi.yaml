                      rcd_count: 1280
                      answer_rate: 0.68
                      average_duration: 172.5
                  scp:
                    signed: 13585
                    service_providers:
                    - deposited: 4100
                      authenticated: 3850
                      blocked: 698
                      service_provider_name: "ATT"
                    - deposited: 4200
                      authenticated: 3900
                      blocked: 712
                      service_provider_name: "VERIZON"
                    - deposited: 4050
                      authenticated: 3780
                      blocked: 673
                      service_provider_name: "TMOBILE"
                account_id: "xyzaccountid"
                request_params:
