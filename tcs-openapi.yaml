  "/ccid/webhook/v1/admin/webhook/encrypt":
    post:
      summary: "Encrypt Secret"
      description: "Convert a plain-text secret (password or API key) into an encrypted value accepted by the webhook registration APIs. Plain-text passwords or API keys are never accepted by webhook APIs — the platform cannot reliably determine whether an incoming value is encrypted unless it conforms to the approved encryption format. This API can be used repeatedly and supports encrypting any single plain-text input."
      operationId: "wb-encrypt"
      tags:
      - "Authentication"
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                value:
                  type: "string"
                  description: "The plain-text secret (password or API key) to encrypt"
              required:
              - "value"
            example:
              value: "myPlainTextPasswordOrApiKey"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  encrypted_value:
                    type: "string"
                    description: "The encrypted value to use as `credentials.password` (oAuth) or `credentials.api_value` (apiKey) when registering a webhook"
                required:
                - "encrypted_value"
              example:
                encrypted_value: "X9aP7KqM2R8vZtYcH1fL"
        "401":
          description: "Unauthorized — invalid or expired access token"
        "404":
          description: "Not Found — resource does not exist"
